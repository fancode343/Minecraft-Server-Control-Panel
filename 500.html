<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Error</title>

  <meta name="robots" content="noindex, nofollow">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #285877, #0c1624);
      overflow: hidden;
    }

    /* Subtle block-style background */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          90deg,
          rgba(0,0,0,0.04) 0,
          rgba(0,0,0,0.04) 48px,
          transparent 48px,
          transparent 96px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(0,0,0,0.03) 0,
          rgba(0,0,0,0.03) 48px,
          transparent 48px,
          transparent 96px
        );
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 380px;
      padding: 42px;
      text-align: center;
      border-radius: 22px;
      background: rgba(24, 22, 22, 0.85);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 45px rgba(0,0,0,0.18);
      animation: floatIn 1s ease;
    }

    .card img {
      width: 135px;
      margin-bottom: 18px;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.25));
    }

    .error-code {
      font-size: 84px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #ffffff;
      margin: 12px 0;
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .desc {
      font-size: 15px;
      color: #faf3f3;
      margin-bottom: 26px;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
      transition: 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(0,0,0,0.28);
      background: linear-gradient(135deg, #5a6fe0, #654099);
    }

    .footer {
      margin-top: 26px;
      font-size: 12px;
      color: #fffafa;
    }

    .footer a {
      color: #555;
      text-decoration: none;
      font-weight: 600;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="../assets/logo.png" alt="Logo">

    <div class="error-code">500</div>
    <div class="title">Server is error</div>
    <div class="desc">
      This page is currently experienced an unexpected error. Please contact the <b>developer</b>.
    </div>

    <a href="/" class="btn">Refresh</a>

    <div class="footer">
     <a href="https://lmnet.cf"> © 2026 learning minds network</a>
    </div>
  </div>

</body>
</html>
